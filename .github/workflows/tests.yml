name: tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  # One latest candidate per pull request and workflow.
  # Dispatch and main push runs use their unique run ID and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Preserve Unicode in captured CLI output on Windows.
  PYTHONUTF8: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      - name: Install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffmpeg -version
          ffprobe -version

      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        working-directory: packages/markitdown
        run: hatch test --python "${{ matrix.python-version }}"


  tests-arm:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      - name: Install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffmpeg -version
          ffprobe -version

      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        working-directory: packages/markitdown
        run: hatch test --python "${{ matrix.python-version }}"


  ocr-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      # Install markitdown from the local checkout rather than PyPI, so the
      # plugin is tested against the sibling package it ships alongside.
      - name: Install packages
        run: pip install ./packages/markitdown ./packages/markitdown-ocr pytest

      - name: Run tests
        working-directory: packages/markitdown-ocr
        run: pytest


  mcp-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      - name: Install packages
        run: pip install "./packages/markitdown[all]" ./packages/markitdown-mcp pytest

      - name: Run tests
        working-directory: packages/markitdown-mcp
        run: pytest


  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run the CLI image
        run: |
          docker build -t markitdown-gc:ci .
          docker run --rm -i markitdown-gc:ci -x .html < packages/markitdown/tests/test_files/test_blog.html | grep -q "Large language models"
      - name: Build and run the MCP image
        run: |
          docker build -t markitdown-mcp:ci packages/markitdown-mcp
          docker run --rm markitdown-mcp:ci --help
