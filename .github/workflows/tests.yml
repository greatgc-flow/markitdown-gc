name: tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  # One latest candidate per pull request and workflow.
  # Dispatch and main push runs use their unique run ID and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Preserve Unicode in captured CLI output on Windows.
  PYTHONUTF8: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  release-policy:
    # Gate logic itself is tested on PR and main, not only after a tag exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s .github/scripts -p 'test_verify_*.py' -v

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffmpeg -version
          ffprobe -version

      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        working-directory: packages/markitdown
        run: hatch test --python "${{ matrix.python-version }}"


  ocr-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.15 skipped: sibling packages pin upstream markitdown<0.2.0 (no 3.15 wheel)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install markitdown from the local checkout rather than PyPI, so the
      # plugin is tested against the sibling package it ships alongside.
      - name: Install packages
        run: pip install ./packages/markitdown ./packages/markitdown-ocr pytest

      - name: Run tests
        working-directory: packages/markitdown-ocr
        run: pytest


  mcp-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.15 skipped: sibling packages pin upstream markitdown<0.2.0 (no 3.15 wheel)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: pip install "./packages/markitdown[all]" ./packages/markitdown-mcp pytest

      - name: Run tests
        working-directory: packages/markitdown-mcp
        run: pytest

  # Build one native wheel per workflow run. The three ARM test suites still
  # run independently; non-ARM matrix cells do not need this job and are never
  # held behind the expensive OpenSSL build.
  arm-wheel:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build native Cryptography wheel
        uses: ./.github/actions/build-arm-cryptography
      - name: Record same-run wheel hash and version evidence
        shell: pwsh
        run: |
          python .github/scripts/verify_arm_wheel.py --wheel-dir "$env:RUNNER_TEMP/cryptography-wheels" --constraints .github/constraints.txt --mode write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-arm64-cryptography-wheel
          path: ${{ runner.temp }}/cryptography-wheels/
          if-no-files-found: error
          retention-days: 1

  # All 3 ARM suites consume one wheel from the SAME workflow run.
  # Artifact failure, a missing member, a wrong architecture, or a manifest
  # mismatch is a hard failure; no silent source build fallback is allowed.
  arm-tests:
    needs: arm-wheel
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, ocr, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-arm64-cryptography-wheel
          path: ${{ runner.temp }}/cryptography-wheels
      - name: Verify exact wheel bytes before package installation
        shell: pwsh
        run: |
          python .github/scripts/verify_arm_wheel.py --wheel-dir "$env:RUNNER_TEMP/cryptography-wheels" --constraints .github/constraints.txt --mode verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'cryptography-wheels'
          "PIP_FIND_LINKS=$wheelhouse" >> $env:GITHUB_ENV
          "UV_FIND_LINKS=$wheelhouse" >> $env:GITHUB_ENV
          "PIP_ONLY_BINARY=cryptography" >> $env:GITHUB_ENV
      - name: Install Hatch
        if: matrix.suite == 'core'
        run: pipx install hatch
      - name: Run core tests
        if: matrix.suite == 'core'
        working-directory: packages/markitdown
        run: hatch test --python "3.12"
      - name: Install OCR packages
        if: matrix.suite == 'ocr'
        run: pip install ./packages/markitdown ./packages/markitdown-ocr pytest
      - name: Run OCR tests
        if: matrix.suite == 'ocr'
        working-directory: packages/markitdown-ocr
        run: pytest
      - name: Install MCP packages
        if: matrix.suite == 'mcp'
        run: pip install "./packages/markitdown[all]" ./packages/markitdown-mcp pytest
      - name: Run MCP tests
        if: matrix.suite == 'mcp'
        working-directory: packages/markitdown-mcp
        run: pytest
